[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-crate-digger"
version = "1.1.0"
description = "Organise a DJ library with any AI agent: BPM, Camelot key, genre, energy, renaming and sorting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["dj", "music", "camelot", "bpm", "rekordbox", "serato", "traktor", "mcp", "agent-skills"]
dependencies = ["mutagen>=1.47"]

[project.optional-dependencies]
audio = ["librosa>=0.10", "soundfile>=0.12"]
mcp = ["mcp>=1.2"]
all = ["librosa>=0.10", "soundfile>=0.12", "mcp>=1.2"]

[project.scripts]
crate-digger = "crate_digger:main"
crate-digger-mcp = "crate_digger_mcp:main"

[project.urls]
Homepage = "https://github.com/eroldmc/dj-crate-digger"

[tool.setuptools]
package-dir = { "" = "skills/dj-crate-digger/scripts" }
py-modules = ["crate_digger", "crate_digger_mcp"]

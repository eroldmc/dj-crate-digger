name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install mutagen pytest
      - run: pip install mcp
        continue-on-error: true
      - run: pytest -q
  release-zip:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: cd skills && zip -r ../dj-crate-digger.zip dj-crate-digger -x '*__pycache__*'
      - uses: softprops/action-gh-release@v2
        with:
          files: dj-crate-digger.zip
